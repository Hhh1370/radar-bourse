name: Codal image pipeline tests

on:
  push:
    paths:
      - "scripts/extract_codal_disclosures.py"
      - "scripts/process_codal_reports.py"
      - "tests/test_codal_image_pipeline.py"
      - ".github/workflows/codal-image-tests.yml"
  pull_request:
    paths:
      - "scripts/extract_codal_disclosures.py"
      - "scripts/process_codal_reports.py"
      - "tests/test_codal_image_pipeline.py"
      - ".github/workflows/codal-image-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependency
        run: python -m pip install --upgrade pip openpyxl
      - name: Install Persian OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fas
      - name: Run regression tests
        run: python -m unittest discover -s tests -p 'test_codal_image_pipeline.py' -v
