name: Build Technical Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_technical_radar.py"
      - "tests/**"
      - "data/history/**"
      - "data/stock_universe.json"
      - "data/history_manifest.json"
      - ".github/workflows/build-technical-radar.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: technical-radar-build
  cancel-in-progress: false

jobs:
  build-technical-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax and regression tests
        run: |
          python -m py_compile scripts/build_technical_radar.py scripts/build_dashboard_data.py scripts/build_fundamental_money_radar.py tests/test_technical_targets.py tests/test_technical_factors.py tests/test_financial_report_selection.py tests/test_quarterly_fundamental_scoring.py
          python -m unittest discover -s tests -v

      - name: Build technical radar
        run: python -u scripts/build_technical_radar.py

      - name: Verify ranking output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/technical_radar.json").read_text(encoding="utf-8"))
          rows = p.get("top_50_for_review", [])
          assert p.get("analysis_errors", 0) == 0, f"analysis errors: {p.get('analysis_errors')}"
          assert rows, "No eligible technical candidates were produced"
          assert all("relative_momentum_score" in row for row in rows), "Relative momentum score missing"
          assert all(isinstance(row["risk_adjusted_score"], (int, float)) for row in rows), "Risk-adjusted score missing"
          assert all(isinstance(row.get("technical_rank_score"), (int, float)) for row in rows), "Continuous technical rank score missing"
          expected_factors = {
              "multi_timeframe_trend", "daily_market_structure", "weekly_market_structure",
              "monthly_market_structure", "volume_price_pressure", "breakout_structure",
              "trend_efficiency", "volatility_quality",
          }
          for row in rows:
              factors = row.get("technical_factor_scores")
              assert isinstance(factors, dict) and expected_factors.issubset(factors), f"Multi-factor technical scores missing for {row.get('symbol')}"
              assert all(value is None or (isinstance(value, (int, float)) and math.isfinite(value) and 0 <= value <= 100) for value in factors.values()), f"Invalid technical factor score for {row.get('symbol')}"
              factor_weight = row.get("technical_factor_available_weight")
              assert isinstance(factor_weight, (int, float)) and 0 <= factor_weight <= 100, f"Invalid factor coverage for {row.get('symbol')}"
              assert isinstance(row.get("market_structure"), dict), f"Market structure diagnostics missing for {row.get('symbol')}"
              assert isinstance(row.get("volume_price_analysis"), dict), f"Volume-price diagnostics missing for {row.get('symbol')}"
              assert isinstance(row.get("breakout_analysis"), dict), f"Breakout diagnostics missing for {row.get('symbol')}"
          universe = p.get("all_eligible_ranked", [])
          assert len(universe) == p.get("eligible_for_long_term_ranking"), "Full eligible universe must be retained"
          def sort_key(row):
              momentum = row.get("momentum_pct", {})
              monthly = momentum.get("monthly_6_period")
              weekly = momentum.get("weekly_13_period")
              daily60 = momentum.get("daily_60_period")
              return (
                  -float(row.get("technical_rank_score") or 0),
                  -float(row.get("risk_adjusted_score") or 0),
                  -float(row.get("relative_momentum_score") or 0),
                  -(float(monthly) if monthly is not None else -1e12),
                  -(float(weekly) if weekly is not None else -1e12),
                  -(float(daily60) if daily60 is not None else -1e12),
                  str(row.get("symbol") or ""),
              )
          keys = [sort_key(row) for row in rows]
          assert keys == sorted(keys), "Technical candidates are not sorted by the declared ranking fields"
          print(f"TECHNICAL_OUTPUT_VALID: {len(rows)} candidates; full_eligible={len(universe)}; eligible={p.get('eligible_for_long_term_ranking')}; errors={p.get('analysis_errors')}")
          print("MULTI_FACTOR_TECHNICAL_VALID: market structure + volume-price + breakout + trend efficiency + volatility + multi-timeframe trend")
          print("TOP_10_TECHNICAL_RANK:")
          for row in rows[:10]:
              print(f"{row['symbol']}\trank={row['technical_rank_score']}\tbase={row['risk_adjusted_score']}\trelative={row['relative_momentum_score']}")
          PY


      - name: Rebuild dashboard from freshly generated technical radar
        run: python -u scripts/build_dashboard_data.py

      - name: Verify target contract and regenerated dashboard
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          technical = json.loads(Path("data/technical_radar.json").read_text(encoding="utf-8"))
          dashboard = json.loads(Path("data/radar_dashboard.json").read_text(encoding="utf-8"))
          rows = technical.get("all_eligible_ranked", [])
          target_statuses = {"available": 0, "unavailable": 0}
          for row in rows:
              target = row.get("technical_targets")
              assert isinstance(target, dict), f"Missing target object for {row.get('symbol')}"
              assert target.get("status") in target_statuses, f"Invalid target status for {row.get('symbol')}"
              target_statuses[target["status"]] += 1
              if target["status"] != "available":
                  assert target.get("buy") is None and target.get("sell") is None, "Unavailable data must not expose scenarios"
                  continue
              close = target.get("current_price")
              atr = target.get("atr14")
              assert isinstance(close, (int, float)) and close > 0, "Invalid target reference price"
              assert isinstance(atr, (int, float)) and math.isfinite(atr) and atr > 0, "Invalid ATR"
              for direction in ("buy", "sell"):
                  setup = target.get(direction)
                  if setup is None:
                      continue
                  entry, stop, tp1 = setup.get("entry_reference"), setup.get("stop_loss"), setup.get("target_1")
                  assert all(isinstance(v, (int, float)) and math.isfinite(v) for v in (entry, stop, tp1)), f"Invalid {direction} geometry for {row.get('symbol')}"
                  assert abs(entry - close) < 0.0001, "Entry reference must equal daily close"
                  assert setup.get("risk_reward_tp1", 0) >= 1.3, "Scenario below minimum reward/risk"
                  if direction == "buy":
                      assert stop < entry < tp1, f"Bad buy geometry for {row.get('symbol')}"
                  else:
                      assert tp1 < entry < stop, f"Bad sell geometry for {row.get('symbol')}"
                  tp2 = setup.get("target_2")
                  if tp2 is not None:
                      assert tp2 > tp1 if direction == "buy" else tp2 < tp1, "Target 2 must extend beyond target 1"

          assert dashboard.get("schema_version") == 1
          visible = dashboard.get("candidates", [])
          assert len(visible) == 10, f"Expected 10 visible candidates, got {len(visible)}"
          assert sum(x.get("bucket") == "main" for x in visible) == 5
          assert sum(x.get("bucket") == "watch" for x in visible) == 5
          assert all(isinstance(x.get("technical_targets"), dict) for x in visible)
          assert dashboard.get("generated_at_utc"), "Dashboard generation time missing"
          if dashboard.get("summary", {}).get("fundamental_statement_scored_count", 0) == 0:
              assert dashboard.get("summary", {}).get("final_credit_grade_count", 0) == 0, "Final rating gate failed"
          print(f"TECHNICAL_TARGETS_VALID: {len(rows)} rows; available={target_statuses['available']}; unavailable={target_statuses['unavailable']}")
          print(f"DASHBOARD_REFRESHED: {len(visible)} visible cards; generated_at={dashboard['generated_at_utc']}")
          print(f"FINAL_CREDIT_GRADES: {dashboard['summary'].get('final_credit_grade_count', 0)}")
          PY

      - name: Commit technical results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Validate the dashboard locally, then explicitly dispatch its dedicated workflow.
          # GITHUB_TOKEN pushes do not start downstream push-triggered workflows.
          git add data/technical_radar.json
          git checkout -- data/radar_dashboard.json
          if git diff --cached --quiet; then
            echo "No technical radar changes."
          else
            git commit -m "Rebuild technical and dashboard radar data"
            # Other collectors may update source JSON while this long scan runs.
            git pull --rebase origin main
            git push
          fi

      - name: Dispatch dashboard rebuild after technical update
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-dashboard-data.yml/dispatches" -d '{"ref":"main"}'
