name: Build Valid Stock Universe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and validate stock universe
        run: python scripts/build_universe.py

      - name: Commit universe
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock_universe.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Build validated stock universe"
            git push
          fi
