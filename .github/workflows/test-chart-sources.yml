name: Test Free Chart Data Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-chart-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test historical chart endpoints
        run: python scripts/test_chart_sources.py
