name: Check Iranian Market Data Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 0,1,2,3,6"

permissions:
  contents: write

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Install Selenium
        run: python -m pip install selenium

      - name: Export browser paths
        shell: bash
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> "$GITHUB_ENV"

      - name: Collect Rahavard market data
        run: python scripts/check_sources.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marketmap.json

          if git diff --cached --quiet; then
            echo "Market data has no changes."
          else
            git commit -m "Update market map data"
            git push
          fi
