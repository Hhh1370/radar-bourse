name: Check Iranian Market Data Sources

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 6-3"

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check TSETMC and Codal
        run: python scripts/check_sources.py
