name: Probe Alternate TSETMC Data Routes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_tsetmc_alternate_routes.py"
      - ".github/workflows/probe-tsetmc-alternate-routes.yml"

permissions:
  contents: write

concurrency:
  group: tsetmc-alternate-route-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate probe syntax
        run: python -m py_compile scripts/probe_tsetmc_alternate_routes.py

      - name: Test legacy TSETMC and webgw routes
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/probe_tsetmc_alternate_routes.py

      - name: Commit probe result
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s data/tsetmc_alternate_probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tsetmc_alternate_probe.json
          if git diff --cached --quiet; then
            echo "Probe result unchanged."
          else
            git commit -m "Record alternate free TSETMC route probe"
            git pull --rebase origin main
            git push
          fi

      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsetmc-alternate-route-probe
          path: data/tsetmc_alternate_probe.json
          if-no-files-found: warn
          retention-days: 14
