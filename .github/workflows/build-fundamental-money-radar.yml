name: Build Fundamental and Money Flow Radar

on:
  workflow_dispatch:
  # Full-market scan weekly to avoid exhausting third-party API quotas.
  schedule:
    - cron: "30 9 * * 6"

permissions:
  contents: write
  actions: write

concurrency:
  group: fundamental-money-flow-radar
  cancel-in-progress: false

jobs:
  build-fundamental-money-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: python -m py_compile scripts/build_fundamental_money_radar.py

      - name: Preflight BrsApi endpoints before full scan
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: python scripts/build_fundamental_money_radar.py --probe

      - name: Build fundamental, development-project and money-flow radar
        env:
          BRS_API_KEY: ${{ secrets.BRS_API_KEY }}
        run: python scripts/build_fundamental_money_radar.py

      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamental_money_radar.json data/tsetmc_instrument_map.json
          if git diff --cached --quiet; then
            echo "No fundamental/money-flow data changes."
          else
            git commit -m "Build fundamental, project and money flow radar"
            git push
          fi

      - name: Dispatch dashboard rebuild after fundamental and flow refresh
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-dashboard-data.yml/dispatches" -d '{"ref":"main"}'
