name: Probe My Codal and Official Codal API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-codal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Codal endpoints without failing on one blocked host
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from xml.etree import ElementTree

          UA = (
              "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
              "(KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          )
          SYMBOL = "فملی"
          params = {
              "Audited": "true",
              "AuditorRef": "-1",
              "Category": "1",
              "Childs": "false",
              "CompanyState": "0",
              "CompanyType": "-1",
              "Consolidatable": "true",
              "IsNotAudited": "false",
              "Isic": "-1",
              "Length": "5",
              "LetterCode": "",
              "LetterType": "-1",
              "Mains": "true",
              "NotAudited": "false",
              "NotConsolidatable": "true",
              "PageNumber": "1",
              "Publisher": "false",
              "Symbol": SYMBOL,
              "TracingNo": "-1",
              "search": "true",
          }
          query_url = (
              "https://search.codal.ir/api/search/v2/q?"
              + urllib.parse.urlencode(params)
          )
          endpoints = [
              ("CODAL_SEARCH_API", query_url, "application/json, application/xml, */*"),
              ("CODAL_COMPANIES_API", "https://search.codal.ir/api/search/v1/companies", "application/json, */*"),
              ("CODAL_MAIN_SITE", "https://www.codal.ir/", "text/html, */*"),
              ("MY_CODAL_STATEMENTS", "https://my.codal.ir/fa/statements/?page=1", "text/html, */*"),
          ]

          def probe(name, url, accept):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": UA,
                      "Accept": accept,
                      "Accept-Language": "fa-IR,fa;q=0.9,en;q=0.8",
                      "Referer": "https://www.codal.ir/",
                      "Connection": "close",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=12) as response:
                      body = response.read(1_500_000)
                      content_type = response.headers.get("Content-Type", "")
                      print(f"{name}_STATUS: {response.status}")
                      print(f"{name}_FINAL_URL: {response.geturl()[:240]}")
                      print(f"{name}_CONTENT_TYPE: {content_type}")
                      print(f"{name}_BYTES_READ: {len(body)}")
                      sample = body.decode("utf-8-sig", errors="replace").strip()
                      print(f"{name}_SAMPLE: {sample[:180].replace(chr(10), ' ')}")
                      low = sample.lower()
                      if name == "CODAL_SEARCH_API":
                          parsed = False
                          try:
                              data = json.loads(sample)
                              parsed = True
                              if isinstance(data, dict):
                                  print(f"{name}_JSON_KEYS: {','.join(list(data.keys())[:20])}")
                                  letters = data.get("Letters") or data.get("letters") or []
                                  print(f"{name}_LETTER_ROWS: {len(letters) if isinstance(letters, list) else 'not-a-list'}")
                                  if isinstance(letters, list) and letters:
                                      print(f"{name}_FIRST_TITLE: {str(letters[0].get('Title', ''))[:160]}")
                              elif isinstance(data, list):
                                  print(f"{name}_JSON_ROWS: {len(data)}")
                          except Exception:
                              pass
                          if not parsed and sample.startswith("<"):
                              try:
                                  root = ElementTree.fromstring(sample)
                                  print(f"{name}_XML_ROOT: {root.tag}")
                                  print(f"{name}_XML_ROWS: {len(list(root))}")
                              except Exception as exc:
                                  print(f"{name}_PARSE_NOTE: {type(exc).__name__}")
                      print(f"{name}_OK: True")
              except Exception as exc:
                  print(f"{name}_OK: False")
                  print(f"{name}_ERROR: {type(exc).__name__}: {str(exc)[:260]}")

          print("Starting endpoint checks; one failed host will not stop the probe.")
          for name, url, accept in endpoints:
              print(f"--- {name} ---")
              probe(name, url, accept)
          print("PROBE_FINISHED: True")
          print("Note: this is only a connectivity check; no full-universe scan was run.")
          PY
