name: Probe Public Fundai Ratio History

on:
  push:
    branches: [main]
    paths:
      - "scripts/probe_fundai_ratio_history.py"
      - ".github/workflows/probe-fundai-history.yml"
      - "data/fundai_financial_ratios.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundai-ratio-history-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate probe syntax
        run: python -m py_compile scripts/probe_fundai_ratio_history.py
      - name: Probe documented public frontend route
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/probe_fundai_ratio_history.py
      - name: Commit bounded public-schema probe
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s data/fundai_ratio_history_probe.json ]; then
            echo "No probe payload was produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundai_ratio_history_probe.json
          if git diff --cached --quiet; then
            echo "Fundai history probe unchanged."
          else
            git commit -m "Record public Fundai ratio-history schema probe"
            git pull --rebase origin main
            git push
          fi
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundai-ratio-history-probe
          path: data/fundai_ratio_history_probe.json
          if-no-files-found: warn
          retention-days: 14
