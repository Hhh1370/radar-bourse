name: Probe Fundai Public Data Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_fundai_public_source.py"
      - ".github/workflows/probe-fundai-public-source.yml"

permissions:
  contents: write

concurrency:
  group: fundai-public-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate probe syntax
        run: python -m py_compile scripts/probe_fundai_public_source.py

      - name: Inspect public landing page and linked static assets
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/probe_fundai_public_source.py

      - name: Commit diagnostic report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s data/fundai_source_probe.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundai_source_probe.json
          if git diff --cached --quiet; then
            echo "Fundai source probe unchanged."
          else
            git commit -m "Record Fundai public source probe"
            git pull --rebase origin main
            git push
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundai-public-source-probe
          path: data/fundai_source_probe.json
          if-no-files-found: warn
          retention-days: 14
