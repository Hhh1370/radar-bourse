name: Daily Refresh of Historical Stock Data

on:
  workflow_dispatch:
  # Iranian market trading days: Saturday through Wednesday.
  # 13:30 UTC is after the usual market session; data freshness is still validated from candle dates.
  schedule:
    - cron: "30 13 * * 0-3,6"
  push:
    branches: [main]
    paths:
      - "scripts/fetch_history.py"
      - "scripts/fetch_history_incremental.py"

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-stock-history-refresh
  cancel-in-progress: true

jobs:
  refresh-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install collector dependency
        run: python -m pip install --disable-pip-version-check selenium

      - name: Validate source and browser
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/fetch_history.py scripts/fetch_history_incremental.py
          test -s data/marketmap.json
          "${CHROME_BIN}" --version
          echo "Daily history refresh will incrementally update 1D/W/M series from the current market map."

      - name: Refresh recent bars and merge with existing history
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          # Fetch a recent overlap for each symbol and merge it with the existing history.
          # Keep the manifest so the collector can locate each symbol\x27s last saved bars.
          python -u scripts/fetch_history_incremental.py

      - name: Validate refreshed history manifest
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/history_manifest.json")
          if not p.is_file():
              raise SystemExit("History collector did not produce a manifest.")
          m = json.loads(p.read_text(encoding="utf-8"))
          print("RUN_STATUS:", m.get("status"))
          print("UPDATED_AT_UTC:", m.get("updated_at_utc"))
          print("REQUESTED_SYMBOLS:", m.get("requested_symbols"))
          print("SUCCESSFUL_SYMBOLS:", m.get("successful_symbols"))
          print("PARTIAL_SYMBOLS:", m.get("partial_symbols"))
          print("FAILED_SYMBOLS:", m.get("failed_symbols"))
          print("SUCCESSFUL_INTERVAL_FILES:", m.get("successful_interval_files"))
          if int(m.get("successful_interval_files", 0)) <= 0:
              raise SystemExit("No usable refreshed price-history files; refusing to publish an empty refresh.")
          PY

      - name: Rebuild multi-timeframe technical radar from refreshed history
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_technical_radar.py scripts/build_dashboard_data.py
          python -u scripts/build_technical_radar.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/technical_radar.json").read_text(encoding="utf-8"))
          assert p.get("analysis_errors", 0) == 0, f"technical analysis errors: {p.get('analysis_errors')}"
          assert p.get("eligible_for_long_term_ranking", 0) >= 650, "Technical coverage unexpectedly low"
          print("TECHNICAL_REFRESH_VALID", p.get("generated_at_utc"), p.get("eligible_for_long_term_ranking"))
          PY
      - name: Commit refreshed market history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/history_manifest.json")
          if not p.is_file():
              raise SystemExit("No manifest produced; nothing to commit.")
          data = json.loads(p.read_text(encoding="utf-8"))
          if int(data.get("successful_interval_files", 0)) <= 0:
              raise SystemExit("No usable history files refreshed; not committing.")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/history_manifest.json data/technical_radar.json
          if git diff --cached --quiet; then
            echo "No data files changed."
          else
            git commit -m "Refresh daily TSE/IFB price history"
            git pull --rebase origin main
            git push
          fi

      - name: Upload history manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-stock-history-manifest
          path: data/history_manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Dispatch dashboard rebuild after history and technical refresh
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-dashboard-data.yml/dispatches" -d '{"ref":"main"}'
