name: Collect Iranian Stock History Sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Export browser paths
        shell: bash
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> "$GITHUB_ENV"

      - name: Collect historical candles
        id: collect
        continue-on-error: true
        run: python scripts/fetch_history.py

      - name: Commit collected history and manifest
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/history data/history_manifest.json

          if git diff --cached --quiet; then
            echo "No history or manifest changes to commit."
          else
            git commit -m "Collect Iranian stock history sample"
            git push
          fi

      - name: Mark empty collection as failed
        if: always() && steps.collect.outcome == 'failure'
        run: |
          echo "History collection returned an error. Check the collector log and data/history_manifest.json."
          exit 1
