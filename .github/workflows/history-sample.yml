
name: Collect Iranian Stock History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-iranian-stock-history
  cancel-in-progress: false

jobs:
  collect-history:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Export browser paths
        shell: bash
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> "$GITHUB_ENV"

      - name: Collect all available symbol histories
        id: collect
        continue-on-error: true
        run: python scripts/fetch_history.py

      - name: Commit collected history and manifest
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- data/history data/history_manifest.json

          if git diff --cached --quiet; then
            echo "No history or manifest changes to commit."
          else
            git commit -m "Collect all available stock histories"
            git push
          fi

      - name: Report collection result
        if: always()
        shell: bash
        run: |
          if [ -f data/history_manifest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/history_manifest.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          print("Manifest status:", data.get("status"))
          print("Requested:", data.get("requested_symbols"))
          print("Processed:", data.get("processed_symbols"))
          print("Reused:", data.get("reused_successful_symbols"))
          print("Successful:", data.get("successful_symbols"))
          print("Partial:", data.get("partial_symbols"))
          print("Failed:", data.get("failed_symbols"))
          print("History files:", data.get("successful_interval_files"))
          PY
          else
            echo "History manifest was not created."
          fi
