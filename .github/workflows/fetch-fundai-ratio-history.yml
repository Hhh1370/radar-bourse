name: Fetch Public Fundai Ratio History

on:
  workflow_dispatch:
  # Run after the main public ratio snapshot refresh.
  schedule:
    - cron: "0 16 * * 6"
  push:
    branches: [main]
    paths:
      - "scripts/fundai_ratio_history.py"
      - "scripts/fetch_fundai_ratio_history.py"
      - "tests/test_fundai_ratio_history.py"
      - ".github/workflows/fetch-fundai-ratio-history.yml"
      - "data/fundai_financial_ratios.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: fundai-ratio-history
  cancel-in-progress: false

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate history collector and regression tests
        run: |
          python -m py_compile scripts/fundai_ratio_history.py scripts/fetch_fundai_ratio_history.py tests/test_fundai_ratio_history.py
          python -m unittest discover -s tests -p 'test_fundai_ratio_history.py' -v
      - name: Fetch public company ratio histories
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/fetch_fundai_ratio_history.py
      - name: Verify historical coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/fundai_financial_ratio_history.json").read_text(encoding="utf-8"))
          assert p["successful_company_count"] >= 350
          assert p["coverage_pct"] >= 65
          assert p["successful_company_count"] == len(p["history_rows"])
          assert p["total_history_rows"] > p["successful_company_count"]
          print("FUNDAI_HISTORY_VALID:", p["successful_company_count"], "/", p["target_company_count"])
          print("COVERAGE_PCT:", p["coverage_pct"])
          print("TOTAL_HISTORY_ROWS:", p["total_history_rows"])
          PY
      - name: Commit valid public history snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s data/fundai_financial_ratio_history.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundai_financial_ratio_history.json
          if git diff --cached --quiet; then
            echo "Fundai history data unchanged."
          else
            git commit -m "Update public Fundai ratio history"
            git pull --rebase origin main
            git push
          fi
      - name: Upload ratio-history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fundai-ratio-history
          path: data/fundai_financial_ratio_history.json
          if-no-files-found: warn
          retention-days: 14
      - name: Dispatch dashboard rebuild
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/build-dashboard-data.yml/dispatches" -d '{"ref":"main"}'
