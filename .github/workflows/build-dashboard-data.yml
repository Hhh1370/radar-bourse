name: Build Radar Dashboard Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_dashboard_data.py"
      - "scripts/codal_summary_fundamentals.py"
      - "tests/test_codal_summary_fundamentals.py"
      - ".github/workflows/build-dashboard-data.yml"
      - "data/technical_radar.json"
      - "data/fundamental_money_radar.json"
      - "data/codal_disclosures_latest.json"
      - "data/codal_filing_ledger.json"
      - "data/fundai_financial_ratios.json"

permissions:
  contents: write

concurrency:
  group: radar-dashboard-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate generator syntax and Codal summary regression tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_dashboard_data.py scripts/codal_summary_fundamentals.py tests/test_codal_summary_fundamentals.py
          python -m unittest discover -s tests -p "test_codal_summary_fundamentals.py" -v

      - name: Generate compact dashboard data
        run: python -u scripts/build_dashboard_data.py

      - name: Validate dashboard data contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("data/radar_dashboard.json").read_text(encoding="utf-8"))
          assert p.get("schema_version") == 1
          rows = p.get("candidates")
          assert isinstance(rows, list) and len(rows) == 10, f"expected 10 rows, got {len(rows) if isinstance(rows, list) else type(rows).__name__}"
          assert sum(x.get("bucket") == "main" for x in rows) == 5
          assert sum(x.get("bucket") == "watch" for x in rows) == 5
          assert "fundamental_scored_count" in p["summary"]
          assert "money_flow_12m_scored_count" in p["summary"]
          assert "final_credit_grade_count" in p["summary"]
          assert "high_confidence_count" in p["summary"]
          assert "codal_ledger_records" in p["summary"]
          assert "codal_ledger_new_records" in p["summary"]
          assert "codal_summary_scored_count" in p["summary"]
          assert "codal_summary_comparable_growth_count" in p["summary"]
          assert "codal_summary_monthly_sales_count" in p["summary"]
          assert all("codal_summary_fundamentals" in x for x in rows)
          assert p["summary"].get("candidate_pool_ranked", 0) >= 650, f"expected broad eligible-universe ranking, got {p['summary'].get('candidate_pool_ranked')}"
          assert all(x.get("symbol") for x in rows)
          assert all(isinstance(x.get("credit_confidence_score"), (int, float)) and 0 <= x["credit_confidence_score"] <= 100 for x in rows)
          assert all(
              isinstance(x.get("credit_score"), (int, float))
              or (
                  x.get("credit_score") is None
                  and not any(
                      isinstance(x.get("credit_assessment", {}).get("component_scores", {}).get(k), (int, float))
                      for k in ("fundamental", "earnings_quality", "money_flow", "projects")
                  )
              )
              for x in rows
          ), "Composite score may be absent only when no nontechnical component exists"
          assert all(x.get("credit_assessment", {}).get("provisional_score_available_weight_pct", 0) <= 100 for x in rows)
          assert all(x.get("final_credit_grade") is None or x["credit_assessment"].get("final_rating_eligible") is True for x in rows)
          if p["summary"].get("fundamental_statement_scored_count", 0) == 0:
              assert p["summary"]["final_credit_grade_count"] == 0, "Final credit grades must remain withheld without structured statement scores"
          assert p["summary"].get("fundai_ratio_rows_available", 0) >= 500, "Fundai ratio snapshot is missing or too small"
          assert p["summary"].get("fundai_ratio_matched_count", 0) >= 450, "Unexpectedly low ticker match count for the ratio snapshot"
          assert p["summary"].get("fundai_ratio_scored_count", 0) >= 400, "Unexpectedly low number of ratio-based fundamental scores"
          expected = sorted(rows, key=lambda x: (-(float(x.get("radar_rank_score")) if isinstance(x.get("radar_rank_score"), (int,float)) else -1), -float(x.get("technical_rank_score") or x.get("risk_adjusted_score") or 0), -(float(x.get("fundamental_score")) if isinstance(x.get("fundamental_score"), (int,float)) else -1), str(x.get("symbol") or "")))
          assert [x.get("symbol") for x in rows] == [x.get("symbol") for x in expected], "Dashboard rows not sorted by the declared provisional ranking"
          print(f"DASHBOARD_DATA_VALID: {len(rows)} visible rows from pool {p['summary']['candidate_pool_ranked']}")
          print(f"FUNDAMENTAL_SCORED: {p['summary']['fundamental_scored_count']}")
          print(f"MONEY_FLOW_12M_SCORED: {p['summary']['money_flow_12m_scored_count']}")
          print(f"FINAL_CREDIT_GRADES: {p['summary']['final_credit_grade_count']}")
          print(f"CODAL_LEDGER_RECORDS: {p['summary']['codal_ledger_records']}")
          print(f"CODAL_LEDGER_NEW: {p['summary']['codal_ledger_new_records']}")
          print(f"CODAL_SUMMARY_SCORED: {p['summary']['codal_summary_scored_count']}")
          print(f"HIGH_CONFIDENCE: {p['summary']['high_confidence_count']}")
          for x in rows:
              print(f"RANK:{x['rank']} SYMBOL:{x['symbol']} SCORE:{x.get('credit_score')} DATA_CONFIDENCE:{x.get('credit_confidence_score')} FINAL_GRADE:{x.get('final_credit_grade')}")
          PY

      - name: Commit generated dashboard data
        shell: bash
        run: |
          set -euo pipefail
          test -s data/radar_dashboard.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radar_dashboard.json
          if git diff --cached --quiet; then
            echo "Dashboard data is unchanged."
          else
            git commit -m "Update radar dashboard data"
            git pull --rebase origin main
            git push
          fi

      - name: Upload dashboard data artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-dashboard-data
          path: data/radar_dashboard.json
          if-no-files-found: warn
          retention-days: 14
